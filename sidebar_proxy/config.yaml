name: Sidebar Proxy
version: "2026.10.03.07"
slug: sidebar_proxy
description: Open any website, even on your home network, inside Home Assistant from one sidebar page
url: https://github.com/drmogie/ha-sidebar-sites
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:swap-horizontal
panel_title: Sidebar Sites
panel_admin: true
options:
  sites: []
schema:
  sites:
    - name: str
      url: url
      verify_ssl: bool?
