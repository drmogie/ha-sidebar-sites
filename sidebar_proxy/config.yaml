name: Sidebar Proxy
version: "2026.10.04.08"
slug: sidebar_proxy
description: Open any website, even on your home network, inside Home Assistant from one sidebar page
url: https://github.com/drmogie/ha-sidebar-sites
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:swap-horizontal
panel_title: Sidebar Sites
panel_admin: true
options:
  home_networks: ""
  sites: []
schema:
  home_networks: str?
  sites:
    - name: str
      url: url
      verify_ssl: bool?
      hidden: bool?
      rewrite: bool?
      timeout: int(5,3600)?
      use_login: bool?
      username: str?
      password: password?
